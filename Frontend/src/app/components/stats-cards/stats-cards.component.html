<div class="stats-row" [class.admin-cols]="userRole === 'Admin'" [class.operator-cols]="userRole !== 'Admin'">
  <div class="stat-card">
    <div class="stat-icon icon-blue"><i class="fa-solid fa-network-wired"></i></div>
    <div class="stat-details">
      <h3>Monitoreados</h3>
      <p class="stat-value">{{ monitoredCount }}</p>
    </div>
  </div>

  <div *ngIf="userRole === 'Admin'" class="stat-card">
    <div class="stat-icon icon-orange"><i class="fa-solid fa-gas-pump"></i></div>
    <div class="stat-details">
      <h3>Baja Autonomía</h3>
      <p class="stat-value">{{ lowAutonomyCount }}</p>
    </div>
  </div>

  <div class="stat-card stat-card-fleet">
    <div class="stat-icon icon-green"><i class="fa-solid fa-gauge-high"></i></div>
    <div class="stat-details">
      <h3>Promedio Flota</h3>
      <p class="stat-value">{{ averageSpeed.toFixed(1) }} <span style="font-size: 14px;">km/h</span></p>
    </div>
  </div>
</div>

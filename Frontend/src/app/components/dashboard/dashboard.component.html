<div class="dashboard-container" (click)="closeUserMenu()">
  <!-- Toast Notifications -->
  <div class="toast-container" aria-live="polite">
    <div
      *ngFor="let toast of toastNotifications"
      class="toast-item"
      [ngClass]="'toast-' + toast.type"
      (click)="$event.stopPropagation()">
      <i class="fa-solid" [ngClass]="toast.type === 'alert' ? 'fa-triangle-exclamation' : 'fa-circle-info'"></i>
      <span>{{ toast.message }}</span>
      <button type="button" class="toast-close" (click)="dismissToast(toast.id); $event.stopPropagation()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="nav-left">
      <div class="nav-logo">
        <i class="fa-solid fa-truck-monster"></i>
      </div>
      <div class="nav-title">
        <h1>Simon Movilidad</h1>
        <p class="nav-subtitle">Dashboard de Monitoreo IoT</p>
      </div>
    </div>

    <div class="nav-right">
      <div class="status-badge" [ngClass]="isOnline ? 'badge-online' : 'badge-offline'">
        <i class="fa-solid" [ngClass]="isOnline ? 'fa-wifi' : 'fa-triangle-exclamation'"></i>
        <span class="status-label">{{ isOnline ? 'EN LÍNEA' : 'MODO OFFLINE' }}</span>
      </div>

      <!-- User Dropdown -->
      <div class="user-dropdown" (click)="$event.stopPropagation()">
        <button
          type="button"
          class="user-dropdown-trigger"
          (click)="toggleUserMenu($event)"
          [attr.aria-expanded]="userMenuOpen"
          aria-label="Menú de usuario">
          <div class="user-avatar">
            <i class="fa-solid fa-user-gear"></i>
          </div>
          <div class="user-info-desktop">
            <span class="user-name">{{ userEmail }}</span>
            <span class="user-role" [ngClass]="userRole === 'Admin' ? 'role-admin' : 'role-user'">
              {{ userRole === 'Admin' ? 'Administrador' : 'Operador Estándar' }}
            </span>
          </div>
          <i class="fa-solid fa-chevron-down dropdown-chevron" [class.open]="userMenuOpen"></i>
        </button>

        <div class="user-dropdown-menu" *ngIf="userMenuOpen">
          <div class="dropdown-header">
            <span class="user-name">{{ userEmail }}</span>
            <span class="user-role" [ngClass]="userRole === 'Admin' ? 'role-admin' : 'role-user'">
              {{ userRole === 'Admin' ? 'Administrador' : 'Operador Estándar' }}
            </span>
          </div>
        </div>
      </div>

      <button (click)="logout()" class="btn-logout" title="Cerrar Sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Mobile View Tabs -->
  <nav class="mobile-view-tabs">
    <button
      type="button"
      class="mobile-tab"
      [class.active]="mobileView === 'list'"
      (click)="setMobileView('list')">
      <i class="fa-solid fa-list-check"></i> Flota
    </button>
    <button
      type="button"
      class="mobile-tab"
      [class.active]="mobileView === 'map'"
      (click)="setMobileView('map')">
      <i class="fa-solid fa-earth-americas"></i> Mapa
    </button>
  </nav>

  <main class="main-content">
    <!-- Sidebar: Fleet List -->
    <app-fleet-list
      [class.mobile-hidden]="mobileView === 'map'"
      [vehiclesList]="vehiclesList"
      [selectedVehicleId]="selectedVehicleId"
      (vehicleSelected)="selectVehicle($event)">
    </app-fleet-list>

    <!-- Central Body Panel -->
    <section class="center-panel" [class.mobile-hidden]="mobileView === 'list'">
      <!-- Stats Cards -->
      <app-stats-cards
        [monitoredCount]="vehiclesList.length"
        [lowAutonomyCount]="lowAutonomyCount"
        [userRole]="userRole"
        [averageSpeed]="62.4">
      </app-stats-cards>

      <div class="visualizer-grid">
        <!-- Map Component -->
        <div class="visualizer-card map-card">
          <div class="card-title">
            <h3><i class="fa-solid fa-earth-americas"></i> Mapa de Operación Realtime</h3>
            <button
              *ngIf="selectedVehicleId && !autoFollowMap"
              type="button"
              class="btn-relock"
              (click)="autoFollowMap = true; mapComponent.setFollowVehicle(selectedVehicleId!, true); mapComponent.flyToVehicle(selectedVehicleId!)">
              <i class="fa-solid fa-crosshairs"></i> Seguir {{ selectedVehicleId }}
            </button>
          </div>
          <div class="card-content map-wrapper">
            <app-map (userMapInteraction)="onMapUserInteraction()" (vehicleSelected)="selectVehicle($event)"></app-map>
          </div>
        </div>

        <!-- History Chart Component -->
        <app-history-chart
          [selectedVehicleId]="selectedVehicleId"
          [telemetriesHistory]="telemetriesHistory">
        </app-history-chart>
      </div>

      <!-- Predictive Alerts Component -->
      <app-predictive-alerts
        [activeAlerts]="activeAlerts"
        [userRole]="userRole">
      </app-predictive-alerts>
    </section>
  </main>
</div>
